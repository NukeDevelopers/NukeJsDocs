name: Deploy docs container

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'GHCR image tag to deploy'
        required: false
        default: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN || github.token }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          IMAGE: ghcr.io/nukedevelopers/nukejsdocs:${{ inputs.image_tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: GHCR_READ_TOKEN,GHCR_USERNAME,IMAGE
          script: |
            set -eu
            command -v docker >/dev/null 2>&1 || { echo 'docker is not installed on the server'; exit 1; }
            echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker pull "$IMAGE"
            docker rm -f nukejsdocs 2>/dev/null || true
            docker run -d --name nukejsdocs --restart unless-stopped -p 18765:80 "$IMAGE"
            docker image prune -f
